<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
<defs>
<filter id="ink" x="-20%" y="-20%" width="140%" height="140%"><feComponentTransfer in="SourceAlpha" result="a"><feFuncA type="linear" slope="4" intercept="-2"/></feComponentTransfer><feMorphology in="a" operator="dilate" radius="3" result="d"/><feFlood flood-color="#1c1512"/><feComposite in2="d" operator="in" result="o"/><feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<radialGradient id="glow"><stop offset="0" stop-color="#6cc24a" stop-opacity="0.7"/><stop offset="1" stop-color="#6cc24a" stop-opacity="0"/></radialGradient>
<linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef3f6"/><stop offset="0.45" stop-color="#c9d2d8"/><stop offset="1" stop-color="#8d989f"/></linearGradient>
<g id="staple"><path d="M -7 3 L -7 -3 L 7 -3 L 7 3" fill="none" stroke="#1c1512" stroke-width="4" stroke-linejoin="round"/><path d="M -7 3 L -7 -3 L 7 -3 L 7 3" fill="none" stroke="#dfe6ea" stroke-width="1.8" stroke-linejoin="round"/></g>
</defs>
<!-- 1. the overmind implant -->
<g transform="translate(120 170)">
<path d="M -70 30 C -70 -40 70 -40 70 30 Z" fill="#8f8d88"/>
<circle cx="0" cy="-60" r="80" fill="url(#glow)"/>
<g filter="url(#ink)">
<path d="M -56 6 C -56 -54 56 -54 56 6 Q 0 22 -56 6 Z" fill="url(#chrome)"/>
<path d="M -50 -6 Q 0 8 50 -6" fill="none" stroke="#1c1512" stroke-width="1.5" opacity="0.5"/>
<ellipse cx="5" cy="-24" rx="20" ry="18" fill="#98d97e" stroke="#1c1512" stroke-width="1.6"/>
<ellipse cx="0" cy="-30" rx="6" ry="4" fill="#fff"/>
<ellipse cx="-30" cy="-40" rx="10" ry="4" fill="#fff" opacity="0.7" transform="rotate(-25 -30 -40)"/>
</g>
<use href="#staple" transform="translate(-44 10) rotate(17)"/><use href="#staple" transform="translate(44 10) rotate(-17)"/>
</g>
<!-- 2. staples and stitches across a seam -->
<g transform="translate(330 170)" filter="url(#ink)">
<path d="M -70 -40 L 70 -40 L 70 40 L -70 40 Z" fill="#cb6a32"/>
<path d="M -70 0 L 70 0 L 70 40 L -70 40 Z" fill="url(#chrome)"/>
</g>
<g transform="translate(330 170)">
<use href="#staple" transform="translate(-50 0) scale(1.6) rotate(90)"/><use href="#staple" transform="translate(-16 0) scale(1.6) rotate(90)"/><use href="#staple" transform="translate(18 0) scale(1.6) rotate(90)"/><use href="#staple" transform="translate(52 0) scale(1.6) rotate(90)"/>
<path d="M -60 -24 Q 0 -14 60 -24" fill="none" stroke="#1c1512" stroke-width="2.6" stroke-dasharray="6 4"/>
</g>
<!-- 3. mutagen vial -->
<g transform="translate(540 170)">
<circle r="80" fill="url(#glow)"/>
<g filter="url(#ink)">
<rect x="-60" y="-24" width="120" height="48" fill="#dcefeb" opacity="0.85"/>
<rect x="-60" y="-6" width="120" height="30" fill="#98d97e"/>
<rect x="-60" y="-16" width="120" height="6" fill="#ffffff" opacity="0.6"/>
<circle cx="-14" cy="8" r="4" fill="#fffbe0"/><circle cx="18" cy="14" r="3" fill="#fffbe0"/>
<rect x="-74" y="-30" width="14" height="60" fill="url(#chrome)"/><rect x="60" y="-30" width="14" height="60" fill="url(#chrome)"/>
</g>
</g>
<!-- 4. squared, flared barrel -->
<g transform="translate(760 180) rotate(-35)" filter="url(#ink)">
<rect x="-50" y="-22" width="36" height="44" rx="6" fill="#7d8992"/>
<rect x="-16" y="-17" width="80" height="34" fill="url(#chrome)"/>
<path d="M 64 -26 L 80 -32 L 80 32 L 64 26 Z" fill="#7d8992"/>
</g>
<circle cx="830" cy="130" r="26" fill="url(#glow)"/>
<!-- 5. steel claws -->
<g transform="translate(960 190)" filter="url(#ink)">
<ellipse cx="-20" cy="-24" rx="40" ry="30" fill="#3a3438"/>
<path d="M -30 -10 Q 4 -14 10 10 Q -8 0 -26 4 Z M -6 -10 Q 28 -14 34 10 Q 16 0 -2 4 Z M 18 -10 Q 52 -14 58 10 Q 40 0 22 4 Z" fill="url(#chrome)"/>
</g>
<!-- 6. hypnotised eye -->
<g transform="translate(1110 160)">
<circle r="56" fill="url(#glow)"/>
<g filter="url(#ink)">
<ellipse rx="34" ry="36" fill="#1c1512"/>
<ellipse cx="5" cy="4" rx="19" ry="20" fill="#98d97e"/>
<ellipse cx="7" cy="5" rx="9" ry="11" fill="#1c1512"/>
<ellipse cx="-12" cy="-14" rx="8" ry="7" fill="#fff"/>
</g>
</g>
</svg>
