name: Play in the browser (GitHub Pages)

# Publishes the web build of each release to GitHub Pages, so the game can be played in a browser.
# Runs when a release is published, or by hand from the Actions tab.
on:
  release:
    types: [published]
  workflow_dispatch:

# Least privilege: the build (which runs npm install scripts) only reads; only deploy can publish.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
