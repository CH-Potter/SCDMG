<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SCDMG Rig Lab (dev)</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        font: 13px/1.4 system-ui, sans-serif;
        background: #1d1915;
        color: #eee6d8;
        display: grid;
        grid-template-columns: 300px 1fr;
        height: 100vh;
        overflow: hidden;
      }
      aside {
        overflow-y: auto;
        padding: 10px 12px 24px;
        border-right: 1px solid #3a332b;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 6px;
      }
      h2 {
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #c9b48a;
        margin: 14px 0 6px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      button {
        color: inherit;
        background: #3a332b;
        border: 1px solid #5a4f42;
        border-radius: 5px;
        padding: 4px 8px;
        font: inherit;
        cursor: pointer;
      }
      button[aria-pressed="true"] {
        background: #6b5a3c;
        border-color: #c9b48a;
      }
      label {
        display: flex;
        gap: 6px;
        align-items: center;
        margin: 2px 0;
      }
      input[type="range"] {
        width: 100%;
      }
      #stage {
        position: relative;
        min-width: 0;
      }
      #readout {
        position: absolute;
        left: 8px;
        bottom: 8px;
        background: #1d1915cc;
        padding: 6px 8px;
        border-radius: 6px;
        font: 12px/1.35 ui-monospace, monospace;
        white-space: pre;
        pointer-events: none;
      }
      small {
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <aside id="panel"></aside>
    <main id="stage"><div id="readout"></div></main>
    <script type="module" src="/src/rigLab.ts"></script>
  </body>
</html>
